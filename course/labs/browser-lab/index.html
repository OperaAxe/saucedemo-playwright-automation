<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Playwright Course Browser Lab</title>
</head>
<body>
  <main>
    <h1>Browser Lab</h1>
    <form id="profile-form">
      <label for="name">Name</label>
      <input id="name" name="name" required>
      <button type="submit">Save profile</button>
    </form>
    <p id="status" role="status"></p>
    <button id="confirm-delete" type="button">Delete draft</button>
    <a id="download" download="course-lab.txt" href="data:text/plain,Playwright%20course%20download">Download file</a>
    <label for="upload">Upload fixture</label>
    <input id="upload" type="file">
    <a id="popup" target="_blank" href="details.html">Open details</a>
  </main>
  <script>
    document.querySelector('#profile-form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#status').textContent = 'Profile saved';
    });
    document.querySelector('#confirm-delete').addEventListener('click', () => {
      if (window.confirm('Delete draft?')) {
        document.querySelector('#status').textContent = 'Draft deleted';
      }
    });
  </script>
</body>
</html>
