name: Shopify Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  safe-tests:
    name: Safe storefront tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run safe tests
        run: pytest -m "not authenticated" --html=reports/safe-report.html --self-contained-html

      - name: Upload safe-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-test-artifacts
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

  authenticated-tests:
    name: Authenticated storefront tests
    if: ${{ secrets.SHOPIFY_TEST_EMAIL != '' && secrets.SHOPIFY_TEST_PASSWORD != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run authenticated tests
        env:
          SHOPIFY_TEST_EMAIL: ${{ secrets.SHOPIFY_TEST_EMAIL }}
          SHOPIFY_TEST_PASSWORD: ${{ secrets.SHOPIFY_TEST_PASSWORD }}
        run: pytest -m authenticated --html=reports/authenticated-report.html --self-contained-html

      - name: Upload authenticated-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-test-artifacts
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
