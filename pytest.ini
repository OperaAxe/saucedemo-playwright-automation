[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --browser chromium --tracing retain-on-failure --screenshot only-on-failure
markers =
    authenticated: requires SHOPIFY_TEST_EMAIL and SHOPIFY_TEST_PASSWORD
    login: customer authentication and account-entry coverage
    ui: navigation, responsive, and visual smoke coverage
